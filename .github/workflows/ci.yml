name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so a drifted corpus source shows up without a PR

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: unit tests for the catch-baseline comparison
        run: python3 -m unittest discover -s eval -p 'test_*.py'

  corpus-gate:
    # The false-positive gate: no error or warning on any valid corpus file,
    # and every must-parse reference case clean. evaluate.py exits 1 on either,
    # and 2 if its known-bad control stops firing.
    name: corpus false-positive gate
    runs-on: ubuntu-latest
    env:
      # Bump deliberately, in its own PR, so a corpus change is never mixed
      # with a checker change.
      CORPUS_REF: a5073ec3c7bdba4e480a09af66408242d809ecae
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: quickcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: taslater/databricks-sql-corpus
          ref: ${{ env.CORPUS_REF }}
          path: corpus
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quickcheck/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: corpus/pyproject.toml
      - name: build quickcheck
        working-directory: quickcheck
        run: npm ci && npm run build
      - name: install the corpus harness
        run: python -m pip install -e ./corpus
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/corpus/cache
          key: corpus-cache-${{ hashFiles('corpus/src/dbsqlparse/corpus/sources.py') }}
      - name: fetch the pinned public corpus
        working-directory: corpus
        run: python -m dbsqlparse.corpus fetch
      - name: the corpus checks, run side by side
        # Four checks, in order of the names in the log groups below:
        #   evaluate            no false positive on valid corpus SQL (exit 1 or 2)
        #   no lost catch       compare_baseline: a lost catch fails. It reads the
        #                       results evaluate writes, so it runs after evaluate,
        #                       and only if evaluate passed (as before, a failed
        #                       evaluate stopped the job before it).
        #   grammar agreement   the grammar agrees with the lexer on every file
        #   shape sets          the shipped shape sets against every valid source
        # The last three read the same corpus and write nothing shared, so they
        # run concurrently with evaluate. Each writes its own log and exit code,
        # the logs are printed in their own groups, and the step fails if any
        # check failed, with that check's exit code (evaluate's 1 or 2 first).
        working-directory: quickcheck
        run: |
          set +e
          logs="$RUNNER_TEMP/gate-logs"
          rm -rf "$logs"
          mkdir -p "$logs"
          step() {
            # step NAME COMMAND...: output to $logs/NAME.log, exit code to NAME.rc
            local name=$1
            shift
            if "$@" >"$logs/$name.log" 2>&1; then
              echo 0 >"$logs/$name.rc"
            else
              echo $? >"$logs/$name.rc"
            fi
          }
          (
            step evaluate python eval/evaluate.py --corpus ../corpus
            if [ "$(cat "$logs/evaluate.rc")" = 0 ]; then
              step baseline python eval/compare_baseline.py
            fi
          ) &
          chain=$!
          step grammar node out/test/grammar-corpus.js ../corpus/corpus/cache &
          grammar=$!
          step shapes python scripts/derive_shape_sets.py --corpus ../corpus &
          shapes=$!
          wait "$chain" "$grammar" "$shapes"

          failed=0
          first=0
          for pair in "evaluate:evaluate" "baseline:no lost catch against the committed baseline" \
                      "grammar:the grammar agrees with the lexer on every corpus file" \
                      "shapes:re-check the shipped shape sets against every valid source"; do
            name=${pair%%:*}
            label=${pair#*:}
            if [ ! -f "$logs/$name.rc" ]; then
              echo "::group::$label (skipped: evaluate failed)"
              echo "::endgroup::"
              continue
            fi
            rc=$(cat "$logs/$name.rc")
            echo "::group::$label (exit $rc)"
            cat "$logs/$name.log"
            echo "::endgroup::"
            if [ "$rc" != 0 ]; then
              echo "::error::$label exited $rc"
              failed=1
              if [ "$first" = 0 ]; then first=$rc; fi
            fi
          done
          if [ "$failed" != 0 ]; then
            exit "$first"
          fi
      - name: headline numbers in the job summary
        if: always()
        working-directory: quickcheck
        run: python eval/compare_baseline.py --headline >> "$GITHUB_STEP_SUMMARY"
